name: Install analytics tracking

on:
  push:
    branches: [main]
    paths:
      - 'analytics-tracking.js'
      - '.github/workflows/install-analytics-tracking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject analytics tracker in HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = '<script src="/analytics-tracking.js" defer></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              # Skip hidden/tooling folders if they ever contain HTML.
              if any(part.startswith('.') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', f'{marker}\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit injected tracker
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' || true
          git commit -m 'Enable GA4 behavioural and lead tracking'
          git push
