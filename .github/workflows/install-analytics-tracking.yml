name: Install analytics tracking

on:
  push:
    branches: [main]
    paths:
      - 'analytics-tracking.js'
      - '.github/workflows/install-analytics-tracking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update contact number and ensure analytics tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = (
              ('07 57 69 03 22', '06 03 25 76 79'),
              ('0757690322', '0603257679'),
              ('+33757690322', '+33603257679'),
              ('33757690322', '33603257679'),
          )
          text_suffixes = {'.html', '.js', '.txt', '.json', '.xml', '.md'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          tracker_re = re.compile(r'<script\s+[^>]*src=["\'][^"\']*analytics-tracking\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          marker = '<script src="/analytics-tracking.js" defer></script>'
          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if tracker_re.search(text) or '</body>' not in text:
                  continue
              text = text.replace('</body>', f'{marker}\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(sorted(set(changed))) if changed else 'none')
          PY

      - name: Commit site-wide updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Climeo34 phone and WhatsApp number site-wide'
          git push
