name: Update Google reviews cache

# Récupère les avis Google côté serveur (aucune restriction CORS ici, contrairement
# au navigateur), triés par date décroissante, et les écrit dans data/google-reviews.json.
# Le site charge ce fichier statique en priorité pour garantir que les avis les plus
# récents s'affichent réellement en premier.
#
# IMPORTANT — clé API : GOOGLE_PLACES_API_KEY doit être une clé SANS restriction
# "référent HTTP" (une clé avec ce type de restriction est catégoriquement refusée
# par ce point d'accès pour tout appel serveur, quel que soit l'en-tête Referer
# envoyé — message Google : "API keys with referer restrictions cannot be used
# with this API"). La clé déjà utilisée côté navigateur dans index.html a ce
# type de restriction et NE PEUT PAS être réutilisée ici : il faut créer une
# clé dédiée dans Google Cloud Console, restreinte uniquement par API
# ("Places API") et sans restriction d'application (ou restreinte par IP si
# possible), puis la renseigner comme secret GOOGLE_PLACES_API_KEY.

on:
  schedule:
    - cron: '0 5 * * *' # tous les jours à 5h UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-google-reviews
  cancel-in-progress: false

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer les avis Google (triés par date)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ChIJodubwNeGWo0R8j-otvrAcW0
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_PLACES_API_KEY:-}" ]; then
            echo "::error::Secret GOOGLE_PLACES_API_KEY manquant — voir README du repo pour le configurer."
            exit 1
          fi

          curl -sS -G "https://maps.googleapis.com/maps/api/place/details/json" \
            -H "Referer: https://climeo34.fr/" \
            --data-urlencode "place_id=${GOOGLE_PLACE_ID}" \
            --data-urlencode "fields=rating,user_ratings_total,reviews" \
            --data-urlencode "reviews_sort=newest" \
            --data-urlencode "language=fr" \
            --data-urlencode "key=${GOOGLE_PLACES_API_KEY}" \
            -o /tmp/google-place-details.json

          status=$(jq -r '.status // "UNKNOWN"' /tmp/google-place-details.json)
          if [ "$status" != "OK" ]; then
            echo "::error::Google API a répondu status=$status — le fichier existant est conservé."
            error_message=$(jq -r '.error_message // empty' /tmp/google-place-details.json || true)
            echo "$error_message"
            if [ "$status" = "REQUEST_DENIED" ] && printf '%s' "$error_message" | grep -qi "referer restrictions"; then
              echo "::error::Le secret GOOGLE_PLACES_API_KEY utilise une clé avec restriction de référent HTTP, incompatible avec cette API côté serveur. Créez une clé dédiée sans restriction d'application (limitée à l'API 'Places API') dans Google Cloud Console et mettez à jour le secret."
            fi
            exit 1
          fi

          mkdir -p data
          jq --arg fetched_at "$(date -u +%FT%TZ)" '
            {
              fetched_at: $fetched_at,
              count: .result.user_ratings_total,
              rating: .result.rating,
              reviews: (
                (.result.reviews // [])
                | map({
                    name: (.author_name // "Client"),
                    text: (.text // ""),
                    relTime: (.relative_time_description // ""),
                    rating: (.rating // 5),
                    time: ((.time // 0) * 1000)
                  })
                | sort_by(-.time)
              )
            }' /tmp/google-place-details.json > data/google-reviews.json

      - name: Commit et push si changement
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualise le cache des avis Google"
          file_pattern: data/google-reviews.json
